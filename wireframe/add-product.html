<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product</title>
    <link rel="stylesheet" href="./wireframe/stylesheet.css">
</head>
<body>

<div class="container">

    <div class="sidebar">
        <h2>InventoryPro</h2>

        <ul>
            <li><a href="./wireframe/dashboard.html">Dashboard</a></li>
            <li><a href="./add-product.html">Products</a></li>
            <li><a href="./bestellingen.html">Orders</a></li>
        </ul>
    </div>

    <div class="form-page">

        <div class="form-card">

            <h1>Add New Product</h1>

            <label>Product Name</label>
            <input type="text">

            <label>Category</label>
            <select>
                <option>Electronics</option>
                <option>Accessories</option>
                <option>Office Supplies</option>
            </select>

            <label>Stock Quantity</label>
            <input type="number">

            <label>Price (€)</label>
            <input type="number">

            <label>Description</label>
            <textarea></textarea>

            <div class="buttons">
                <button class="save">Save Product</button>
                <button class="cancel">Cancel</button>
            </div>

        </div>

    </div>

</div>

</body>
</html>
