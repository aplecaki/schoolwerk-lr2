<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Dashboard</title>
    <link rel="stylesheet" href="./stylesheet.css">
</head>
<body>

<div class="container">

    <div class="sidebar">
        <h2>InventoryPro</h2>

        <ul>
            <li><a href="./dashboard.html">Dashboard</a></li>
            <li><a href="../add-product.html">Products</a></li>
            <li><a href="../bestellingen.html">Orders</a></li>
        </ul>
    </div>

    <div class="main">

        <h1>Inventory Dashboard</h1>

        <div class="cards">

            <div class="card">
                <h3>Total Products</h3>
                <p>125</p>
            </div>

            <div class="card">
                <h3>In Stock</h3>
                <p>112</p>
            </div>

            <div class="card">
                <h3>Low Stock</h3>
                <p>13</p>
            </div>

        </div>

        <div class="table-container">
            <h2>Recent Inventory</h2>

            <table>
                <tr>
                    <th>Product</th>
                    <th>Stock</th>
                    <th>Status</th>
                </tr>

                <tr>
                    <td>Keyboard</td>
                    <td>24</td>
                    <td>Available</td>
                </tr>

                <tr>
                    <td>Mouse</td>
                    <td>6</td>
                    <td>Low Stock</td>
                </tr>

                <tr>
                    <td>Monitor</td>
                    <td>18</td>
                    <td>Available</td>
                </tr>
            </table>
        </div>

    </div>

</div>

</body>
</html>
